<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>PADDOX — Reset Password</title>
  <link rel="stylesheet" href="reset-password.css?v=A4_7C_2"/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
</head>
<body>
  <canvas id="particles-canvas"></canvas>
  <main class="reset-shell">
    <section class="reset-card">
      <a href="index.html" class="brand-lockup" aria-label="PADDOX Home">
        <img src="assets/paddox-logo-icon-web.png?v=A4_10C_4" alt="PADDOX"/>
        <span>PADDO<span>X</span></span>
      </a>
      <p class="kicker">Account Security</p>
      <h1>Reset Password</h1>
      <p class="subcopy">Create a new password for your PADDOX account. The reset link expires in 10 minutes.</p>

      <form id="reset-password-form" class="reset-form">
        <label>New Password</label>
        <input id="new-password" type="password" placeholder="Enter new password" minlength="6" required/>
        <label>Confirm Password</label>
        <input id="confirm-password" type="password" placeholder="Confirm new password" minlength="6" required/>
        <button id="reset-submit" type="submit">Update Password →</button>
      </form>

      <div class="reset-status" id="reset-status"></div>
      <a href="account.html" class="back-link">← Back to Sign In</a>
    </section>
  </main>
  <div class="toast" id="toast"></div>
  <script src="reset-password.js?v=A4_7C_2"></script>
</body>
</html>
