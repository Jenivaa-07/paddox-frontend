<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Paddox — Order Receipt</title>
  <link rel="stylesheet" href="receipt.css?v=18_0_12"/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
</head>
<body>
  <main class="receipt-shell">
    <div class="receipt-screen-head no-print">
      <div class="receipt-screen-actions" id="receipt-actions" style="display:none">
        <button id="print-receipt" type="button">Print / Save PDF</button>
        <a href="account.html">My Orders</a>
        <a href="shop.html">Shop</a>
      </div>
    </div>

    <section class="receipt-card" id="receipt-card">
      <div class="receipt-loading">
        <div class="receipt-spinner"></div>
        <p>Loading receipt...</p>
      </div>
    </section>
  </main>

  <div class="toast no-print" id="toast"></div>
  <script src="receipt.js?v=18_0_12"></script>
</body>
</html>
