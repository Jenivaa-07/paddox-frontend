<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Paddox — Order Receipt</title>
  <link rel="stylesheet" href="receipt.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
</head>
<body>
  <canvas id="receipt-particles"></canvas>

  <main class="receipt-shell">
    <section class="receipt-hero">
      <a href="shop.html" class="receipt-logo">
        <span class="receipt-logo-mark"><img src="assets/paddox-logo-icon.png" alt="PADDOX logo" class="pdx-logo-img"/></span>
        <span class="receipt-logo-text">PADDO<span>X</span></span>
      </a>
      <div class="receipt-kicker">ORDER RECEIPT</div>
      <h1>PAYMENT RECEIPT</h1>
      <p>Your PADDOX payment receipt with complete order and delivery details.</p>
    </section>

    <section class="receipt-card" id="receipt-card">
      <div class="receipt-loading">
        <div class="receipt-spinner"></div>
        <p>Loading receipt...</p>
      </div>
    </section>

    <div class="receipt-actions" id="receipt-actions" style="display:none">
      <button id="print-receipt">Print / Save PDF</button>
      <a href="account.html">View My Orders</a>
      <a href="shop.html">Continue Shopping</a>
    </div>
  </main>

  <div class="toast" id="toast"></div>
  <script src="receipt.js"></script>
</body>
</html>
